; This is a function configuration file for Oh-My-GXDE.

[MetaData]
ModuleName=GXDELock
ModuleVersion=1.0.0
EnableUnstable=OFF

[Stable]
; Global wallpaper and cursor of every user's lock screen (SetWallpaper*,
; SetCursor). The key names are kept for Oh-My-GXDE compatibility.
SetGreeterWallpaper=ON
SetGreeterCursor=ON
SetLkScreenWallpaper=OFF
TryEnrollLkScreen=ON

[NextFeatReq]
SwitchLkScrStyle=MODERN     ; Defaulting to MODERN, the other option is CLASSIC.
